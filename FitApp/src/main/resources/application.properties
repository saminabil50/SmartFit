spring.application.name=FitApp
spring.config.import=optional:file:.env[.properties]

#TODO: enable these when you have a DB Docker container
spring.datasource.url=jdbc:mysql://localhost:3306/fitApp
spring.datasource.username=root
spring.datasource.password=1234578
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#spring.datasource.url=jdbc:postgresql://localhost:5432/FitAppDB
#spring.datasource.username=postgres
#spring.datasource.password=0000
#
#spring.jpa.show-sql=true
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Database migrations. Baseline at 0 lets existing development schemas adopt
# Flyway and still run V1__create_clothing_items.sql.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT (override JWT_SECRET env var in production)
app.jwt.secret=${JWT_SECRET:change_this_secret_in_production_min_32_chars_long}
app.jwt.expiration-ms=604800000

# Show error messages in response body
server.error.include-message=always

# snake_case JSON for all endpoints
spring.jackson.property-naming-strategy=SNAKE_CASE

# Multipart file upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Local uploads directory (relative to working directory)
app.uploads.dir=uploads

# Optional one-time local bootstrap: set APP_ADMIN_EMAIL to an existing user email.
app.admin.email=${APP_ADMIN_EMAIL:}

# fal.ai virtual try-on (Spring Boot calls fal.ai directly)
fal.key=9b2c5327-6140-48d7-9c4b-73ddee0f1948:06444f327485cee4e6cc37dd9ff4cdb9
fal.tryon.model=${FAL_TRYON_MODEL:fal-ai/fashn/tryon/v1.5}
fal.tryon.category=${FAL_TRYON_CATEGORY:auto}
fal.tryon.mode=${FAL_TRYON_MODE:quality}
fal.tryon.garment-photo-type=${FAL_GARMENT_PHOTO_TYPE:auto}
fal.tryon.moderation-level=${FAL_MODERATION_LEVEL:permissive}
fal.tryon.num-samples=${FAL_NUM_SAMPLES:1}
fal.tryon.segmentation-free=${FAL_SEGMENTATION_FREE:true}
fal.tryon.output-format=${FAL_OUTPUT_FORMAT:png}
fal.tryon.max-wait-seconds=${FAL_TRYON_MAX_WAIT_SECONDS:360}
fal.tryon.poll-interval-seconds=${FAL_TRYON_POLL_INTERVAL_SECONDS:5}
fal.http.connect-timeout-seconds=${FAL_HTTP_CONNECT_TIMEOUT_SECONDS:30}
fal.http.read-timeout-seconds=${FAL_HTTP_READ_TIMEOUT_SECONDS:300}

# AI server URL (Python FastAPI; still used for validation/background removal)
ai.server.url=${AI_SERVER_URL:http://127.0.0.1:9000}
